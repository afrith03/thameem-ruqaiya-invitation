<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thameem &amp; Ruqaiya · Nikkah</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f7eedf; --gold: #e3c37f; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; font-family: 'Cormorant Garamond', Georgia, serif; color: var(--ink);
    background: linear-gradient(135deg, #3a050c 0%, #2a0508 48%, #14286a 52%, #040a1f 100%); }
  main { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 520px; }
  .ar { font-family: 'Amiri', serif; font-size: 24px; color: var(--gold); }
  h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(44px, 12vw, 64px); line-height: 1.1; color: var(--gold); }
  p { font-style: italic; font-size: 19px; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; margin-top: 16px; }
  a { display: flex; flex-direction: column; gap: 4px; padding: 22px 14px; border: 1px solid var(--gold); text-decoration: none; color: var(--ink); font-size: 22px; transition: transform .2s; }
  a:hover, a:focus-visible { transform: translateY(-3px); outline: none; box-shadow: 0 0 0 2px var(--gold); }
  a span { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .r { background: rgba(156,18,38,.35); } .e { background: rgba(35,56,122,.45); }
  @media (max-width: 420px) { .pick { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <p class="ar" lang="ar">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
  <h1>Thameem &amp; Ruqaiya</h1>
  <p>Nikkah · Saturday, 9 January 2027 · S.P. Pattinam</p>
  <div class="pick">
    <a class="r" href="/royal"><span>Version A</span>Royal Maroon &amp; Gold</a>
    <a class="e" href="/navy"><span>Version B</span>Navy Blue &amp; Gold</a>
  </div>
</main>
</body>
</html>
